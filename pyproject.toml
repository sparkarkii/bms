[project]
name = "bms-dl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "gdown>=6.4.1",
    "html5lib>=1.1",
    "patool>=4.1.0",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
]

[project.scripts]
bms-dl = "bms_dl:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
